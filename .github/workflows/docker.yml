name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - staging

env:
  ENVIRONMENT: ${{ github.ref_name == 'dev' && 'prod' || 'staging' }}
  IMAGE_NAME: ${{ github.ref_name == 'dev' && 'structs' || 'structs-staging' }}

jobs:
  build:
    name: "Build (${{ matrix.component }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [client, debugger]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.component }}
          push: true
          platforms: linux/amd64
          file: ${{ matrix.component }}/Dockerfile.prod
          tags: |
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-${{ matrix.component }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: "VITE_DEBUGGER_URL=https://structs.sh"

  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}
    environment: ${{ github.ref_name == 'dev' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: devsoc-unsw/deployment
          token: ${{ secrets.GH_TOKEN }}
          ref: dev
      - name: Install yq
        uses: mikefarah/yq@v4.45.4
      - name: Update deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "CSESoc CD"
          git config user.email "technical@csesoc.org.au"
          git checkout -b update/${{ env.IMAGE_NAME }}/${{ github.sha }}
          yq -i '.items[0].spec.template.spec.containers[0].image = "ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-client:${{ github.sha }}"' projects/structs/${{ env.ENVIRONMENT }}/deploy-frontend.yml
          yq -i '.items[0].spec.template.spec.containers[0].image = "ghcr.io/devsoc-unsw/${{ env.IMAGE_NAME }}-debugger:${{ github.sha }}"' projects/structs/${{ env.ENVIRONMENT }}/deploy-debugger.yml
          git add .
          git commit -m "feat(${{ env.IMAGE_NAME }}): update image"
          git push -u origin update/${{ env.IMAGE_NAME }}/${{ github.sha }}
          gh pr create -B dev --title "feat(${{ env.IMAGE_NAME }}): update image" --body "Updates the image for the ${{ env.IMAGE_NAME }} deployment to commit devsoc-unsw/structs.sh@${{ github.sha }}." > URL
          gh pr merge $(cat URL) --squash -d
