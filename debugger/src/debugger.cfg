# Example config for nsjail

name: "debugger"


mode: ONCE
hostname: "DEBUGGER"
cwd: "/"


time_limit: 0

disable_rl: true

envar: "HOME=/root"
envar: "PATH=/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

clone_newnet: false

cap: "CAP_SYS_PTRACE"


mount {
	src: "/app"
	dst: "/app"
	is_bind: true
	rw: true
}

mount {
	src: "/bin"
	dst: "/bin"
	is_bind: true
	rw: true
}

mount {
	src: "/boot"
	dst: "/boot"
	is_bind: true
	rw: true
}

mount {
	src: "/dev"
	dst: "/dev"
	is_bind: true
	rw: true
}

mount {
	src: "/etc"
	dst: "/etc"
	is_bind: true
	rw: true
}

mount {
	src: "/home"
	dst: "/home"
	is_bind: true
	rw: true
}

mount {
	src: "/lib"
	dst: "/lib"
	is_bind: true
	rw: true
}

mount {
	src: "/mnt"
	dst: "/mnt"
	is_bind: true
	rw: true
}

mount {
	src: "/opt"
	dst: "/opt"
	is_bind: true
	rw: true
}

mount {
	src: "/proc"
	dst: "/proc"
	is_bind: true
	rw: true
}

mount {
	src: "/root"
	dst: "/root"
	is_bind: true
	rw: true
}

mount {
	src: "/run"
	dst: "/run"
	is_bind: true
	rw: true
}

mount {
	src: "/sbin"
	dst: "/sbin"
	is_bind: true
	rw: true
}

mount {
	src: "/srv"
	dst: "/srv"
	is_bind: true
	rw: true
}
mount {
	src: "/sys"
	dst: "/sys"
	is_bind: true
}
mount {
	src: "/tmp"
	dst: "/tmp"
	is_bind: true
	rw: true
}

mount {
	src: "/usr"
	dst: "/usr"
	is_bind: true
	rw: true
}
mount {
	src: "/var"
	dst: "/var"
	is_bind: true
	rw: true
}

